<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo list</title>
    <base href="/todolist/" />
  </head>
  <style>
    *, *::before, *::after {
    box-sizing: border-box;
    }

    * {
      font-family: cursive;
    }

    .todo-app__title {
      font-size: 5vw;
    }
    .task-form {
      position: absolute;
      top: -10px;
      right: 10px;
      text-align: center;
    }
    .task-form__title {
      font-size: 2vmax;
      margin-bottom: 10px;
    }
    .task-form__input {
      width: 25vw;
      height: 30px;
    }

    .task-form__input-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .nav_language-button {
      display: block;
      width: 30px;
      height: 30px;
      margin: 0 auto;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .nav_language-button-title {
      margin: 0;
      text-align: center;
    }

    .nav_language-button img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .task-form__submit {
      margin-top: 10px;
    }

    .todo-app__list {
      font-size: 3vw;
      max-width: 50%;
      margin-left: 30px;
    }

    .task__delete::after {
      content: "\2716";
      color: red;
      margin-left: 5px;
      cursor: pointer;
      font-size: 0.8em;
    }
  </style>
  <body>
  
    <nav class="nav">
        <p class="nav_language-button-title">Polski</p>
        <button
          class="nav_language-button"
          type="button"
          aria-label="Język Polski"
          title="Język Polski"
        >
          <img src="src/images/en-to-pl.png" alt="Język Polski" />
          
      </button>

    <div class="task-form">
      <p class="task-form__title">New task:</p>
      <div class="task-form__input-row">

       
        <input
          class="task-form__input"
          type="text"
          placeholder="Enter new task here"
        />
      </div>
      <button class="task-form__submit">Add task</button>
    </nav>

    <div class="todo-app">
      <h1 class="todo-app__title">To do list:</h1>
      <ol class="todo-app__list"></ol>
    </div>

    <script>
      const addTaskButton = document.querySelector(".task-form__submit");
      const languageButton = document.querySelector(".nav_language-button");
      const languageImage = languageButton.querySelector("img");
      const languageButtonTitle = document.querySelector(
        ".nav_language-button-title"
      );
      const taskFormTitle = document.querySelector(".task-form__title");
      const taskInput = document.querySelector(".task-form__input");
      const todoTitle = document.querySelector(".todo-app__title");
      const toDoList = document.querySelector(".todo-app__list");
      const imagePath = new URL("src/images/", window.location.href);
      let currentLanguage = "en";

      function setupTaskDeletion(taskDeletion, task) {
        taskDeletion.setAttribute("class", "task__delete");
        taskDeletion.setAttribute("role", "button");
        taskDeletion.setAttribute("tabindex", "0");
        taskDeletion.setAttribute("aria-label", "Delete task");

        taskDeletion.addEventListener("click", function () {
          task.remove();
        });
        taskDeletion.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            taskDeletion.click();
          }
        });
      }

      function setLanguage(language) {
        currentLanguage = language;
        const isPolish = language === "pl";

        document.documentElement.lang = language;
        taskFormTitle.textContent = isPolish ? "Nowe zadanie:" : "New task:";
        taskInput.placeholder = isPolish
          ? "Wpisz tutaj nowe zadanie"
          : "Enter new task here";
        addTaskButton.textContent = isPolish ? "Dodaj zadanie" : "Add task";
        todoTitle.textContent = isPolish ? "Lista zadań:" : "To do list:";
        languageImage.src = new URL(
          isPolish ? "pl-to-en.png" : "en-to-pl.png",
          imagePath
        ).href;
        languageImage.alt = isPolish ? "English" : "Język Polski";
        languageButton.title = languageImage.alt;
        languageButton.setAttribute("aria-label", languageImage.alt);
        languageButtonTitle.textContent = isPolish ? "English" : "Polski";
        defaultTaskText.nodeValue = isPolish
          ? "Usuń to zadanie, klikając ->"
          : "Remove this task by clicking ->";
        defaultTask2Text.nodeValue = isPolish
          ? "Dodaj własne zadania za pomocą pola w prawym górnym rogu."
          : "Add your own tasks using the input in upper right corner.";
      }

      languageButton.addEventListener("click", function () {
        setLanguage(currentLanguage === "en" ? "pl" : "en");
      });

      addTaskButton.addEventListener("click", function () {
        const newTask = document.createElement("li");
        const taskValue = taskInput.value;
        const createNewTask = document.createTextNode(taskValue);
        const taskDeletion = document.createElement("span");

        newTask.setAttribute("class", "task");
        newTask.appendChild(createNewTask);
        newTask.appendChild(taskDeletion);
        toDoList.appendChild(newTask);
        setupTaskDeletion(taskDeletion, newTask);

        // Zliczanie spacji
        const spaceCount = (taskValue.match(/ /g) || []).length;

        if (taskValue === "") {
          newTask.textContent =
            currentLanguage === "pl"
              ? "Nic nie rób, wyluzuj ;)"
              : "Do nothing, just chill ;)";
          newTask.appendChild(taskDeletion);
        } else if (taskValue === " ") { 
          newTask.textContent =
            currentLanguage === "pl"
              ? "Naciśnij spację..."
              : "Do spacebar press...";
        } else if (taskValue === "  ") {
          newTask.textContent =
            currentLanguage === "pl"
              ? "Naciśnij spację dwa razy..."
              : "Do spacebar press twice...";
        } else if (taskValue === "   ") {
          newTask.textContent =
            currentLanguage === "pl"
              ? "Naciśnij spację trzy razy..."
              : "Do spacebar press three times...";
        } else if (taskValue == spaceCount.length > 3) {
          console.log("spaceCount = " + taskValue.length);
          newTask.textContent =
            (currentLanguage === "pl"
              ? "Naciśnij spację "
              : "Do spacebar press ") +
            taskValue.length +
            (currentLanguage === "pl" ? " razy💪." : " times💪.");
        } else if ((taskValue == spaceCount.length) === 666) {
          newTask.textContent =
            currentLanguage === "pl" ? "Idź do kościoła." : "Go to church.";
        }
        newTask.appendChild(taskDeletion);
      });

      // Standardowe zadanie na liście
      const defaultTask = document.createElement("li");
      const defaultTaskDeletion = document.createElement("span");
      const defaultTaskText = document.createTextNode(
        "Remove this task by clicking ->"
      );

      defaultTask.setAttribute("class", "task");
      defaultTask.appendChild(defaultTaskText);
      toDoList.appendChild(defaultTask);
      setupTaskDeletion(defaultTaskDeletion, defaultTask);
      defaultTask.appendChild(defaultTaskDeletion);

      // Kolejne standardowe zadanie na liście
      const defaultTask2 = document.createElement("li");
      const defaultTask2Deletion = document.createElement("span");
      const defaultTask2Text = document.createTextNode(
        "Add your own tasks using the input in upper right corner."
      );

      defaultTask2.setAttribute("class", "task");
      defaultTask2.appendChild(defaultTask2Text);
      toDoList.appendChild(defaultTask2);
      setupTaskDeletion(defaultTask2Deletion, defaultTask2);
      defaultTask2.appendChild(defaultTask2Deletion);

      // // 3  zadanie na liście
      // const defaultTask3 = document.createElement("li");
      // const defaultTask3Deletion = document.createElement("span");
      // const defaultTask3Text = document.createTextNode(
      //   "Test, submodule działa! mogę to usunąć! :D->"
      // );

      // defaultTask3.appendChild(defaultTask3Text);
      // toDoList.appendChild(defaultTask3);
      // defaultTask3Deletion.setAttribute("class", "task__delete");
      // defaultTask3.appendChild(defaultTask3Deletion);
      // defaultTask3Deletion.addEventListener("click", function () {
      //   defaultTask3.remove();
      // });

      setLanguage("en");
    </script>
  </body>
</html>
